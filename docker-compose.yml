services:
  qwen2api:
    build: .
    container_name: qwen2api
    restart: unless-stopped
    ports:
      - "${PORT:-7860}:7860"
    env_file:
      - .env
    volumes:
      - ./data:/workspace/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
